#############################################################################################################
#                                                                                                           #
# 为了减少重复配置，本配置文件为此nexora-one-admin的独有配置，更多配置请查看 nexora-one-base 项目中的 nexora-one-base.yaml 通用配置文件。      #
# 其中此文件中配置可以覆盖 nexora-one-base.yaml 中的通用配置，具体实现类请看类：YamlProcessor.java                          #
#                                                                                                           #
#############################################################################################################

# 项目配置: 名称、日志目录
project:
  name: nexora-one-admin
  log-directory: /home/project/nexoraone/test/log

# 项目端口和url根路径
server:
  port: 1024
  # 统一解析受信任反向代理转发的协议和客户端地址
  forward-headers-strategy: framework
  servlet:
    context-path: /

# 环境
spring:
  profiles:
    active: test

# 知识库源文件与解析任务统一使用该 MinIO；按部署环境替换，或通过环境变量覆盖。
knowledge:
  minio:
    endpoint: ${KNOWLEDGE_MINIO_ENDPOINT:http://192.168.13.35:9000}
    bucket: ${KNOWLEDGE_MINIO_BUCKET:knowledge-docs}
    access-key: ${KNOWLEDGE_MINIO_ACCESS_KEY:zFepnpaZwxWyhCsVCzbl}
    secret-key: ${KNOWLEDGE_MINIO_SECRET_KEY:M1gAloVl32yTxWiv5XCOQmfq0V0n4YsuhNdvNpLK}
    region: ${KNOWLEDGE_MINIO_REGION:us-east-1}
    path-style-access: ${KNOWLEDGE_MINIO_PATH_STYLE_ACCESS:true}
