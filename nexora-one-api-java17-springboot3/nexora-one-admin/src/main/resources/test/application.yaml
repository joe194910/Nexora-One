# 项目配置: 名称、日志目录
project:
  name: nexora-one-admin
  log-directory: /home/project/nexoraone/test/log

# 项目端口和url根路径
server:
  port: 11024
  # 统一解析受信任反向代理转发的协议和客户端地址
  forward-headers-strategy: framework
  servlet:
    context-path: /

# 环境
spring:
  profiles:
    active: test

